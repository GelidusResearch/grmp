; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter, extra scripting
;   Upload options: custom port, speed and extra flags
;   Library options: dependencies, extra library storages
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; log access via SEGGER RTT
; "C:\Program Files\SEGGER\JLink\JLinkRTTLogger.exe" -Device NRF52832_XXAA -if SWD -Speed 4000 -RTTChannel 0 rtt.log

[env:nrf52832_dk]
platform = nordicnrf52
framework = zephyr
board = nrf52832_mdk
monitor_port = COM73
board_build.f_cpu = 64000000L
monitor_speed = 115200
upload_protocol = jlink
debug_tool = jlink

; Debug build: adds verbose RTT logging (printk on every BLE advertisement
; burst/position change). Not for battery-powered field use - the extra
; CPU/RTT activity on every Hall-sensor event measurably increases current
; draw. Use "pio run -e nrf52832_dk_debug" when you need the logs.
[env:nrf52832_dk_debug]
extends = env:nrf52832_dk
build_flags =
    -D CONFIG_BT_DEBUG_LOG
