CONFIG_BT=y
CONFIG_BT_DEVICE_NAME="GRMP1 Position Sensor"

CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_NVS_DATA_CRC=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# Let Zephyr suspend unused peripherals and drop the SoC into its lowest-
# power idle state between Hall-effect events, ADC samples, and BLE bursts.
CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y

# Route printk/console output over SEGGER RTT so it can be viewed through
# the J-Link probe without needing a wired UART connection.
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
