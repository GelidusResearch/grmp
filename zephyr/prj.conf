CONFIG_BT=y
CONFIG_BT_DEBUG_LOG=y
CONFIG_BT_DEVICE_NAME="GRMP1 Position Sensor"

CONFIG_GPIO=y
CONFIG_ADC=y

# Route printk/console output over SEGGER RTT so it can be viewed through
# the J-Link probe without needing a wired UART connection.
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
